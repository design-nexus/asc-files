name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      # Keep caches, temp files and the test home on the bind-mounted workspace, not the
      # container's overlayfs, which may refuse RENAME_EXCHANGE and other calls the engine tests use.
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache
      CARGO_TERM_COLOR: always
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git rustup python3 fontconfig dejavu-sans-fonts dejavu-serif-fonts dejavu-sans-mono-fonts
      - uses: actions/checkout@v5
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --workspace --locked
      - name: No GLib, GTK, Qt or GPUI in the engine or backend
        run: scripts/check-no-glib.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Tests
        run: scripts/test.sh

  app:
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache
      CARGO_TERM_COLOR: always
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Tools
        run: >
          dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git rustup cmake ninja-build pkgconf
          qt6-qtbase-devel qt6-qttools-devel qt6-linguist glib2-devel qt6-qtdeclarative-devel qt6-qtsvg qt6-qtmultimedia-devel kf6-syntax-highlighting-devel python3 ffmpeg-free shared-mime-info bubblewrap poppler-utils
          fontconfig dejavu-sans-fonts dejavu-serif-fonts dejavu-sans-mono-fonts
      - uses: actions/checkout@v5
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the app and the backend
        run: scripts/app.sh build
      - name: App tests (against the real backend, private home)
        run: scripts/app.sh test

  rpm:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Tools
        run: >
          dnf install -y --setopt=install_weak_deps=False git rpm-build cargo rust cmake ninja-build gcc-c++
          glib2-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel qt6-qttools-devel
          qt6-linguist kf6-syntax-highlighting-devel desktop-file-utils appstream
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build the RPMs (offline, from the sources and vendored crates)
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/rpm.sh
      - name: Install them, and check what they installed
        run: |
          dnf install -y dist/asc-files-0*.x86_64.rpm dist/asc-files-rar-0*.x86_64.rpm
          test -x /usr/bin/asc-files
          for helper in asc-files-backend asc-files-docs asc-files-render asc-files-rar; do
            test -x /usr/libexec/asc-files/$helper
          done
          desktop-file-validate /usr/share/applications/asc-files.desktop
          /usr/libexec/asc-files/asc-files-backend --version || true
          QT_QPA_PLATFORM=offscreen /usr/bin/asc-files --version
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/*.rpm
