[package]
name = "asc-files-docs"
description = "Files' document reader: turns a document into safe HTML for the preview, in the sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ammonia = "4"
base64 = "0.22"
calamine = "0.36.1"
csv = "1.4.0"
docx-rs = { version = "0.4.22", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
mermaid-svg = "0.7.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.41.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
rquickjs = "0.13.0"
serde_json = "1.0"
zip = "9.0.4"

[dev-dependencies]
tempfile = "3.27.0"
